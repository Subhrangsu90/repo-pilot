<!doctype html>
<html lang="en" data-theme="graphite">
<head>
  <meta charset="utf-8">
  <title>RepoPilot</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <!-- Apply the saved theme before first paint (see core/theme.ts). -->
  <script>
    try {
      if (localStorage.getItem('repopilot-theme') === 'light') document.documentElement.dataset.theme = 'light';
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
